[project]
name = "verity-core"
version = "0.1.0"
description = "Shared foundation for Verity Labs' RL environment auditing tools."
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Verity Labs" }]
requires-python = ">=3.11"
dependencies = [
    "docker>=7.1.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0.1",
]

[project.optional-dependencies]
litellm = ["litellm>=1.44.0"]

[project.urls]
Homepage = "https://github.com/Verity-AI-Labs/Verity-Core"
Repository = "https://github.com/Verity-AI-Labs/Verity-Core"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/verity_core"]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
